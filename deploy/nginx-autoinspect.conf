# /etc/nginx/sites-available/autoinspect  (inspect.example.com apne domain se badlein)
# HTTPS certificate: sudo certbot --nginx -d inspect.example.com
# (certbot is file mein ssl_certificate lines aur HTTP->HTTPS redirect khud jor deta hai)

server {
    listen 80;
    server_name inspect.example.com;

    # 14 zones x 2 photos phone se, har photo kuch MB
    client_max_body_size 100M;

    # AI ko waqt chahiye (deploy/gunicorn.conf.py ka timeout bhi 180)
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Uploaded + AI-marked photos: Nginx seedha disk se deta hai (tez)
    location /media/ {
        alias /srv/autoinspect/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # CSS/JS: WhiteNoise bhi de sakta hai, Nginx se aur tez
    location /static/ {
        alias /srv/autoinspect/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
